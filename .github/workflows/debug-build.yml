name: Build debug APKs (no signing)

on:
  workflow_dispatch:
  push:
    branches:
      - ci/debug-build
    paths:
      - ".github/workflows/debug-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Android SDK 37.0
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "13114758"
          packages: "platform-tools platforms;android-37.0 build-tools;37.0.0 ndk;29.0.14206865 cmake;3.22.1"

      - name: Configure SDK 37.0 target
        run: |
          printf 'toolchainVersion=21\n' > gradle/gradle-daemon-jvm.properties
          cat > "$RUNNER_TEMP/tv-sdk-compat.init.gradle" <<'GRADLE'
          gradle.beforeProject { p ->
              ['com.android.application', 'com.android.library'].each { pluginId ->
                  p.pluginManager.withPlugin(pluginId) {
                      p.extensions.getByName('androidComponents').finalizeDsl { dsl ->
                          if (dsl.compileSdk == 37) dsl.compileSdkMinor = 0
                      }
                  }
              }
          }
          GRADLE

      - name: Checkout Media3 fork
        uses: actions/checkout@v4
        with:
          repository: wobuhui666/media
          ref: 342f6590e02ac390e0bd6b4488b8a1bff55747c1
          path: .media3
          fetch-depth: 1

      - name: Limit Media3 composite modules
        run: |
          test -d .media3/build-logic
          test -d .media3/build-logic-settings
          test -f .media3/libraries/ui_danmaku/build.gradle.kts
          for module in lib-inspector test-data test-utils test-utils-robolectric; do
            test -f ".github/media3-stubs/$module/build.gradle"
          done
          cp .github/media3-composite-settings.gradle.kts .media3/settings.gradle.kts

      - name: Grant gradlew permission
        run: chmod +x ./gradlew

      - name: Build debug APKs
        env:
          MEDIA3_SOURCE_DIR: ${{ github.workspace }}/.media3
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_LOGO_SIZE: ${{ vars.TMDB_LOGO_SIZE }}
        run: ./gradlew -I "$RUNNER_TEMP/tv-sdk-compat.init.gradle" assembleLeanbackArm64_v8aDebug assembleLeanbackArmeabi_v7aDebug --no-daemon --build-cache --max-workers=2

      - name: Upload debug APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-apks
          path: app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
